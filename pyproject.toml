[project]
name = "agent-cost-study"
version = "0.1.0"
description = "Budget-matched, oracle-free comparison of LLM agent scaffolds"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.9.0",
    "openai==3.20.0",
    "httpx==0.28.1",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "tqdm==4.70.1",
    "python-dotenv==1.4.0",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
acs-runner = "acs.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit the live network (Wikipedia / DeepSeek / HuggingFace)",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
package-dir = {"" = "src"}
